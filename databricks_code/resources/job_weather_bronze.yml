resources:
  jobs:
    weather_bronze:
      name: "Marketpulse weather_bronze [${bundle.target}]"
      # Bronze load for the weather/hazard sources — SEPARATE from weather_download during dev:
      # weather_download takes minutes (54 MB tarball + normalize), while these loaders are
      # iterated often, so coupling them would re-run the slow download on every loader change.
      # PREREQ the operator owns: weather_download has already landed raw.fema_nri/nri_counties.csv
      # and the climate_normals _processed Parquet. The two loaders are independent (different
      # tables) so they run in PARALLEL. At production maturity they can fold into weather_download.
      # Design: _dev_planning/design_docs/weather_bronze_load_design.md Sec 7.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: shared_lib_path
          default: ${var.shared_lib_path}
      # Serverless spark_python_task (init/finalize) needs a job-level environment + a
      # task-level environment_key; notebook_task does not.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        # Runs first: inserts the pipeline_log row and sets the pipeline_run_id taskValue.
        # task_key MUST stay "init_pipeline_log" — notebook_init reads the run id via
        # dbutils.jobs.taskValues.get(taskKey="init_pipeline_log", ...).
        - task_key: init_pipeline_log
          spark_python_task:
            python_file: ../libs/init_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
          environment_key: default

        # The two loaders are independent (different Bronze tables) → parallel, both gated
        # only on init. load_fema_nri reads the landed CSV; load_climate_normals reads the
        # _processed Parquet.
        - task_key: load_fema_nri
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../bronze/load_fema_nri.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        - task_key: load_climate_normals
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../bronze/load_climate_normals.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        # Closes the pipeline_log row. run_if: ALL_DONE → fires whether the loaders succeeded,
        # failed, or were skipped; pipeline_log_finalize derives final status by scanning
        # pipeline_step_log (see finalize_pipeline_run_log.py).
        - task_key: finalize_pipeline_log
          depends_on:
            - task_key: load_fema_nri
            - task_key: load_climate_normals
          run_if: ALL_DONE
          spark_python_task:
            python_file: ../libs/finalize_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
          environment_key: default
