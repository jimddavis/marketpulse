resources:
  jobs:
    weather_silver_gold:
      name: "Marketpulse [${bundle.target}] weather_silver_gold"
      # Silver (and later Gold) build for the weather/hazard sources — SEPARATE from
      # weather_bronze during dev: the Bronze loaders are a different iteration loop, and keeping
      # this job thin (just the conform/rollup tier) makes the Silver work fast to re-run.
      # PREREQ the operator owns: weather_bronze has populated bronze.fema_nri_counties (incl. the
      # reconciled sovi_score/resl_score) + bronze.climate_normals_stations; catalog_setup has
      # created the Silver facts; seed_dims has built dim_geo; and the county_to_cbsa.csv /
      # station_to_cbsa.csv crosswalks are on the reference Volume. The two loaders are independent
      # (different facts, both read shared dim_geo) so they run in PARALLEL.
      # GOLD: the gold/build_weather_profiles task is appended here in the next slice — the job is
      # named *_silver_gold so that addition needs no rename. Design:
      # _dev_planning/design_docs/weather_silver_gold_design.md Sec 5.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: shared_lib_path
          default: ${var.shared_lib_path}
      # Serverless spark_python_task (init/finalize) needs a job-level environment + a
      # task-level environment_key; notebook_task does not.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        # Runs first: inserts the pipeline_log row and sets the pipeline_run_id taskValue.
        # task_key MUST stay "init_pipeline_log" — notebook_init reads the run id via
        # dbutils.jobs.taskValues.get(taskKey="init_pipeline_log", ...).
        - task_key: init_pipeline_log
          spark_python_task:
            python_file: ../libs/init_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
              - "{{job.name}}"                         # sys.argv[3] — pipeline_log name (this job)
          environment_key: default

        # The two conform/rollup loaders are independent (different Silver facts) → parallel,
        # both gated only on init. Each casts + rolls its Bronze source up to the CBSA atom.
        - task_key: load_silver_fema_hazard
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../silver/load_silver_fema_hazard.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        - task_key: load_silver_noaa_climate
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../silver/load_silver_noaa_climate.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        # Closes the pipeline_log row. run_if: ALL_DONE → fires whether the loaders succeeded,
        # failed, or were skipped; pipeline_log_finalize derives final status by scanning
        # pipeline_step_log (see finalize_pipeline_run_log.py).
        - task_key: finalize_pipeline_log
          depends_on:
            - task_key: load_silver_fema_hazard
            - task_key: load_silver_noaa_climate
          run_if: ALL_DONE
          spark_python_task:
            python_file: ../libs/finalize_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
              - "{{job.run_id}}"                       # sys.argv[3] — this job run's id, for the
                                                       # WorkspaceClient task-outcome cross-check
          environment_key: default
