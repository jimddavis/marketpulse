resources:
  jobs:
    download_sources:
      name: "Marketpulse download_sources  [${bundle.target}] "
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: shared_lib_path
          default: ${var.shared_lib_path}
      # Serverless non-notebook tasks (spark_python_task below) require a job-level
      # environment + a task-level environment_key. Serverless notebook_task does not
      # (which is why catalog_setup has neither).
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        # Runs first: inserts the pipeline_log row and sets the pipeline_run_id
        # taskValue. task_key MUST stay "init_pipeline_log" — notebook_init reads the
        # run id via dbutils.jobs.taskValues.get(taskKey="init_pipeline_log", ...).
        - task_key: init_pipeline_log
          spark_python_task:
            python_file: ../libs/init_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
          environment_key: default
        - task_key: download_sources
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../bronze/download_sources.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"
              # FRED key is NOT passed here — secret references in notebook base_parameters
              # don't deploy reliably on serverless. The notebook reads it directly via
              # dbutils.secrets.get(scope="marketpulse", ...) — see download_sources.ipynb.

        # Transposes the three Zillow wide CSVs into long-form Parquet datasets under
        # RAW_ZILLOW_LONG. Default run_if (ALL_SUCCESS) → only runs if the wide files
        # actually landed. See _dev_planning/design_docs/zillow_wide_to_long_step_design.md.
        - task_key: transpose_zillow_long
          depends_on:
            - task_key: download_sources
          notebook_task:
            notebook_path: ../bronze/load_zillow_long.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        # Closes the pipeline_log row. run_if: ALL_DONE → fires whether the upstream tasks
        # succeeded, failed, or were skipped; pipeline_log_finalize derives final status
        # by scanning pipeline_step_log (see finalize_pipeline_run_log.py).
        - task_key: finalize_pipeline_log
          depends_on:
            - task_key: transpose_zillow_long
          run_if: ALL_DONE
          spark_python_task:
            python_file: ../libs/finalize_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
              - "{{job.run_id}}"                       # sys.argv[3] — this job run's id, for the
                                                       # WorkspaceClient task-outcome cross-check
          environment_key: default
