resources:
  jobs:
    bronze_load:
      name: "Marketpulse bronze_load [${bundle.target}]"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: shared_lib_path
          default: ${var.shared_lib_path}
      # Serverless spark_python_task tasks (init/finalize below) require a job-level
      # environment + a task-level environment_key. notebook_task does not. Mirrors
      # download_sources.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        # Runs first: inserts the pipeline_log row and sets the pipeline_run_id taskValue.
        # task_key MUST stay "init_pipeline_log" — notebook_init reads the run id via
        # dbutils.jobs.taskValues.get(taskKey="init_pipeline_log", ...), which gives the
        # Bronze loaders a real run_id instead of the LOCAL_PIPELINE_ID fallback.
        - task_key: init_pipeline_log
          spark_python_task:
            python_file: ../libs/init_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
          environment_key: default

        # Bronze: FHFA HPI master CSV -> {BRONZE}.fhfa_hpi_master (MERGE, no archive).
        # The four Bronze loaders fan out from init and run in parallel — they write
        # disjoint tables, so there is no inter-loader dependency. load_zillow reads the
        # _long Parquet produced by the download_sources job's transpose step, so that job
        # must have run first (cross-job ordering, owned by the operator).
        - task_key: load_fhfa
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../bronze/load_fhfa.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        - task_key: load_realtor
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../bronze/load_realtor.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        - task_key: load_fred
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../bronze/load_fred.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        - task_key: load_zillow
          depends_on:
            - task_key: init_pipeline_log
          notebook_task:
            notebook_path: ../bronze/load_zillow.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"

        # Closes the pipeline_log row. run_if: ALL_DONE → fires whether the loaders
        # succeeded, failed, or were skipped; pipeline_log_finalize derives final status by
        # scanning pipeline_step_log (see finalize_pipeline_run_log.py).
        - task_key: finalize_pipeline_log
          depends_on:
            - task_key: load_fhfa
            - task_key: load_realtor
            - task_key: load_fred
            - task_key: load_zillow
          run_if: ALL_DONE
          spark_python_task:
            python_file: ../libs/finalize_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
          environment_key: default
