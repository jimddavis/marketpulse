resources:
  jobs:
    error_testing:
      name: "Marketpulse [${bundle.target}] error_testing"
      # Disposable harness for job_status_gate_design.md. Mirrors the AS-BUILT wiring
      # (single finalize_pipeline_log, run_if: ALL_DONE, self-raising) so a green/red sweep
      # is valid evidence for the §3.1 commit gate. Fault injection is run-time only:
      # override `fail_labels` per run, e.g. `databricks bundle run error_testing --params fail_labels=step4_a`.
      # Spec: _dev_planning/design_docs/error_testing_harness_design.md.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: shared_lib_path
          default: ${var.shared_lib_path}
        # CSV of task labels to fail this run. Default empty -> clean SUCCEEDED run.
        - name: fail_labels
          default: ""
      # Serverless spark_python_task (init / noop_task / finalize) needs a job-level
      # environment + a task-level environment_key; serverless notebook_task does not.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
      tasks:
        # Step One — opens the pipeline_log RUNNING row and sets the pipeline_run_id taskValue.
        # task_key MUST stay "init_pipeline_log" (notebook_init + finalize read the taskValue by this key).
        - task_key: init_pipeline_log
          spark_python_task:
            python_file: ../libs/init_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
              - "{{job.name}}"                         # sys.argv[3] — pipeline_log name (this job)
          environment_key: default

        # Step Two — two python no-op tasks (pre-logging class; no StepLog row on failure).
        - task_key: step2_a
          depends_on:
            - task_key: init_pipeline_log
          spark_python_task:
            python_file: ./noop_task.py
            parameters:
              - "step2_a"                              # sys.argv[1] = label
              - "{{job.parameters.fail_labels}}"       # sys.argv[2] = fail_labels
          environment_key: default

        - task_key: step2_b
          depends_on:
            - task_key: init_pipeline_log
          spark_python_task:
            python_file: ./noop_task.py
            parameters:
              - "step2_b"
              - "{{job.parameters.fail_labels}}"
          environment_key: default

        # Step Three — notebook WITH StepLog (logged failure class). Depends on both Step Two tasks.
        - task_key: step3_steplog
          depends_on:
            - task_key: step2_a
            - task_key: step2_b
          notebook_task:
            notebook_path: ./noop_notebook.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"
              label: "step3_steplog"
              step_sequence: "3"
              use_steplog: "true"
              fail_labels: "{{job.parameters.fail_labels}}"

        # Step Four — two notebooks WITHOUT StepLog (pre-logging class). These are the leaves.
        - task_key: step4_a
          depends_on:
            - task_key: step3_steplog
          notebook_task:
            notebook_path: ./noop_notebook.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"
              label: "step4_a"
              step_sequence: "4"
              use_steplog: "false"
              fail_labels: "{{job.parameters.fail_labels}}"

        - task_key: step4_b
          depends_on:
            - task_key: step3_steplog
          notebook_task:
            notebook_path: ./noop_notebook.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              shared_lib_path: "{{job.parameters.shared_lib_path}}"
              label: "step4_b"
              step_sequence: "5"
              use_steplog: "false"
              fail_labels: "{{job.parameters.fail_labels}}"

        # Step Five — the AS-BUILT diagnostic. run_if: ALL_DONE so it fires even when the leaves
        # were skipped by an upstream failure; get_run reads the WHOLE run to find the real failure,
        # writes pipeline_log='failed' + the captured error, then raises -> failed leaf -> job FAILED.
        # task_key MUST stay "finalize_pipeline_log" (the cross-check skips itself by this key).
        - task_key: finalize_pipeline_log
          depends_on:
            - task_key: step4_a
            - task_key: step4_b
          run_if: ALL_DONE
          spark_python_task:
            python_file: ../libs/finalize_pipeline_run_log.py
            parameters:
              - "{{job.parameters.shared_lib_path}}"   # sys.argv[1]
              - "{{job.parameters.catalog}}"           # sys.argv[2]
              - "{{job.run_id}}"                       # sys.argv[3] — this job run's id, for the
                                                       # WorkspaceClient task-outcome cross-check
          environment_key: default
